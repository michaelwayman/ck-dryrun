name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection requires this job by name; it runs exactly what `make check` runs locally.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The docker-container driver can export a type=local layer cache; the default driver can't.
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('services/app/Dockerfile', 'uv.lock', 'frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ hashFiles('services/app/Dockerfile', 'uv.lock', 'frontend/package-lock.json') }}-
            buildx-${{ runner.os }}-
      # The runner context isn't available in job-level env, so the cache dir is set per step.
      - run: make check
        env:
          BUILDX_CACHE: ${{ runner.temp }}/buildx-cache
      # Buildx wrote a fresh cache next to the one it read; keep only the fresh one so the cache
      # doesn't grow with every run.
      - name: Rotate buildx cache
        if: always()
        env:
          BUILDX_CACHE: ${{ runner.temp }}/buildx-cache
        run: |
          if [ -d "$BUILDX_CACHE-new" ]; then
            rm -rf "$BUILDX_CACHE"
            mv "$BUILDX_CACHE-new" "$BUILDX_CACHE"
          fi
