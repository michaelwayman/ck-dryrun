[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokenauth"
version = "1.0.0"
description = "Access-token verification, claims, roles and DRF classes shared by the app and auth services."
requires-python = ">=3.14"
dependencies = ["PyJWT[crypto]>=2.15,<3"]

[project.optional-dependencies]
drf = ["Django>=5.2", "djangorestframework>=3.18"]
test = ["pytest>=9.1", "cryptography>=44"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokenauth"]

[tool.mypy]
strict = true
files = ["src", "tests"]
