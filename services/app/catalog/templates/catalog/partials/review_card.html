{% load catalog_tags %}<article class="card">
  <div class="meta"><a href="{% url 'catalog:brand-detail' review.brand.slug %}">{{ review.brand.name }}</a></div>
  <h3><a href="{% url 'catalog:review-detail' review.slug %}">{{ review.title }}</a></h3>
  <div>{% stars review.rating False %}</div>
  <p class="excerpt">{{ review.content|snippet:24 }}</p>
  <p class="meta">— {{ review.reviewer_name }}{% if review.reviewer_location %}, {{ review.reviewer_location }}{% endif %}</p>
</article>
