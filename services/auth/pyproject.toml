[project]
name = "auth"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # bcrypt 5 rejects inputs over 72 bytes; the WP prehash is 64 base64 characters, so it fits.
    "bcrypt>=5,<6",
    "Django>=5.2,<5.3",
    "django-environ>=0.14,<1",
    # 3.18 requires django>=5.2 and matches djangorestframework-stubs 3.18 in the root dev group.
    "djangorestframework>=3.18,<3.19",
    # 0.30 needs djangorestframework>=3.10.3 and Django>=2.2.
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=26,<27",
    "psycopg[binary]>=3.3,<4",
    # Minting; the same range tokenauth requires.
    "PyJWT[crypto]>=2.15,<3",
    # import_wp_users only (wp-source contract names PyMySQL).
    "PyMySQL>=1.2,<2",
    "tokenauth>=1,<2",
]

[dependency-groups]
# The OpenAPI test validates the contract examples; drf-spectacular itself needs jsonschema>=2.6.
dev = [
    "jsonschema>=4.26,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
tokenauth = { workspace = true }

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
files = ["config", "accounts", "tokens", "tests"]

# django-environ, PyMySQL, drf-spectacular and jsonschema ship no type hints.
[[tool.mypy.overrides]]
module = ["environ", "pymysql", "pymysql.*", "drf_spectacular.*", "jsonschema"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
testpaths = ["tests", "accounts/tests", "tokens/tests"]
pythonpath = ["."]
django_find_project = false
